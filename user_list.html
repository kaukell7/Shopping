<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer List - Spider.io</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #4f46e5; 
            --primary-light: #eef2ff;
            --bg: #0f172a; 
            --main-bg: #f8fafc; 
            --text-main: #1e293b;
            --text-slate: #64748b; 
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--main-bg); 
            margin: 0; 
            display: flex; 
            color: var(--text-main);
        }
        
        /* Sidebar Styles */
        .sidebar { 
            width: 260px; 
            background: var(--bg); 
            color: white; 
            min-height: 100vh; 
            padding: 2rem 1rem; 
            position: fixed; 
            z-index: 1000; 
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .sidebar h2 { 
            padding-left: 1rem; 
            margin-bottom: 3rem; 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            letter-spacing: -1px;
        }
        .nav-item { 
            padding: 1rem 1.2rem; 
            border-radius: 14px; 
            color: #94a3b8; 
            text-decoration: none; 
            margin-bottom: 0.6rem; 
            display: flex; 
            align-items: center; 
            transition: 0.2s; 
            font-weight: 600;
        }
        .nav-item:hover { 
            background: rgba(255, 255, 255, 0.05); 
            color: #fff; 
        }
        .nav-item.active { 
            background: var(--primary); 
            color: white;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }
        .nav-item i { width: 28px; font-size: 1.2rem; }

        /* Main Content */
        .main-content { 
            margin-left: 260px; 
            padding: 2.5rem; 
            width: calc(100% - 260px); 
            box-sizing: border-box; 
        }

        .header-section { 
            margin-bottom: 2.5rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .header-section h1 { 
            margin: 0; 
            font-size: 2rem; 
            font-weight: 800; 
            letter-spacing: -0.5px;
        }
        
        /* Search Box */
        .search-wrapper { 
            position: relative; 
            width: 350px; 
        }
        .search-wrapper i { 
            position: absolute; 
            left: 18px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: var(--text-slate); 
        }
        .search-wrapper input { 
            width: 100%; 
            padding: 14px 20px 14px 50px; 
            border-radius: 18px; 
            border: 1px solid #e2e8f0; 
            outline: none; 
            background: white;
            transition: 0.3s; 
            font-family: inherit;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }
        .search-wrapper input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); 
        }

        /* Table Card */
        .table-card { 
            background: white; 
            border-radius: 28px; 
            border: 1px solid #e2e8f0; 
            overflow: hidden; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.03); 
        }
        table { width: 100%; border-collapse: collapse; }
        th { 
            text-align: left; 
            background: #f8fafc; 
            padding: 20px; 
            color: var(--text-slate); 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            border-bottom: 1px solid #e2e8f0; 
            font-weight: 700; 
        }
        td { 
            padding: 20px; 
            border-bottom: 1px solid #f1f5f9; 
            transition: 0.2s;
        }
        tr:hover td { background-color: #fcfdfe; }
        
        /* User Profile UI */
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-avatar { 
            width: 48px; 
            height: 48px; 
            background: var(--primary); 
            border-radius: 16px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-weight: 800; 
            font-size: 1.2rem; 
        }
        
        .uid-tag {
            font-family: monospace;
            background: var(--primary-light);
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .action-btn {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: 0.2s;
            border: 1px solid #e2e8f0;
        }
        .btn-call { color: #10b981; background: #ecfdf5; border-color: #d1fae5; }
        .btn-map { color: var(--primary); background: var(--primary-light); border-color: #dbeafe; }
        .action-btn:hover { transform: translateY(-3px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        .badge { 
            padding: 6px 12px; 
            border-radius: 12px; 
            font-size: 0.75rem; 
            font-weight: 700; 
            background: #f0fdf4; 
            color: #166534; 
            border: 1px solid #dcfce7;
        }

        @media (max-width: 1000px) {
            .sidebar { width: 85px; padding: 2rem 0.8rem; }
            .sidebar h2 span, .nav-item span { display: none; }
            .main-content { margin-left: 85px; width: calc(100% - 85px); padding: 1.5rem; }
            .header-section { flex-direction: column; align-items: flex-start; gap: 1.5rem; }
            .search-wrapper { width: 100%; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2><i class="fas fa-spider" style="color: var(--primary);"></i> <span>Spider.io</span></h2>
        <nav>
            <a id="navDash" class="nav-item"><i class="fas fa-grid-2"></i> <span>Dashboard</span></a>
            <a id="navInv" class="nav-item"><i class="fas fa-box-archive"></i> <span>Inventory</span></a>
            <a id="navCust" class="nav-item active"><i class="fas fa-user-group"></i> <span>Customers</span></a>
            <a id="navSettings" class="nav-item"><i class="fas fa-sliders"></i> <span>Settings</span></a>
        </nav>
        <div style="position: absolute; bottom: 2rem; width: calc(100% - 2rem);">
            <a href="#" onclick="handleLogout()" class="nav-item" style="color: #ef4444;">
                <i class="fas fa-arrow-right-from-bracket"></i> <span>Logout</span>
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div class="header-section">
            <div>
                <h1 id="pageTitle">Customer Database</h1>
                <p style="color: var(--text-slate); margin: 5px 0 0 0; font-weight: 500;">Manage and track your registered clients</p>
            </div>
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="userSearch" placeholder="Search by name or phone..." onkeyup="filterTable()">
            </div>
        </div>

        <div class="table-card" style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Customer Name</th>
                        <th>Contact & Location</th>
                        <th>Joined Date</th>
                        <th>Total Orders</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr>
                        <td colspan="5" style="text-align:center; padding: 100px;">
                            <i class="fas fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--primary); margin-bottom: 15px;"></i>
                            <div style="color: var(--text-slate); font-weight: 600;">Loading Database...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const API_BASE_URL = "https://shopping-sable-sigma.vercel.app/api";
        let currentAgentName = "";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const agentFromUrl = urlParams.get('agent');
            const loggedInAgent = JSON.parse(localStorage.getItem('currentAgent'));
            
            currentAgentName = agentFromUrl || (loggedInAgent ? loggedInAgent.name : "spider");

            // Navigation Setup
            const param = `?agent=${encodeURIComponent(currentAgentName)}`;
            document.getElementById('navDash').href = `agent-dashboard.html${param}`;
            document.getElementById('navInv').href = `inventory.html${param}`;
            document.getElementById('navCust').href = `user_list.html${param}`;
            document.getElementById('navSettings').href = `shop-settings.html${param}`;

            fetchUsers();
        };

        async function fetchUsers() {
            try {
                const response = await fetch(`${API_BASE_URL}/users?agent=${encodeURIComponent(currentAgentName)}`);
                const users = await response.json();
                const tbody = document.getElementById('userTableBody');
                
                if (!users || users.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" style="text-align:center; padding: 80px;">
                                <div style="background: var(--primary-light); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                                    <i class="fas fa-users-slash" style="font-size: 2rem; color: var(--primary);"></i>
                                </div>
                                <h3 style="margin:0; color: var(--text-main);">ဝယ်ယူသူ မရှိသေးပါ။</h3>
                                <p style="color: var(--text-slate);">သင့်ဆိုင်တွင် စတင်ဝယ်ယူသူများရှိလာပါက ဤနေရာတွင် မြင်တွေ့ရပါမည်။</p>
                            </td>
                        </tr>`;
                    return;
                }

                tbody.innerHTML = users.map(user => {
                    const date = user.createdAt ? new Date(user.createdAt).toLocaleDateString('en-GB', {
                        day: '2-digit', month: 'short', year: 'numeric'
                    }) : 'New Member';
                    
                    const name = user.name || 'Guest User';
                    const initial = name.charAt(0).toUpperCase();
                    const orderCount = user.orderCount || 0;
                    const phone = user.phone || 'N/A';
                    const address = user.address || 'No Address Provided';
                    
                    return `
                        <tr>
                            <td>
                                <div class="user-info">
                                    <div class="user-avatar">${initial}</div>
                                    <div>
                                        <div style="font-weight: 700; color: var(--text-main); font-size: 1rem;">${name}</div>
                                        <div class="uid-tag">ID: ${user._id.slice(-6).toUpperCase()}</div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div style="display: flex; flex-direction: column; gap: 4px;">
                                    <span style="font-weight: 600; font-size: 0.9rem; display:flex; align-items:center; gap:8px;">
                                        <i class="fas fa-phone-alt" style="color: #10b981; font-size: 0.8rem;"></i> ${phone}
                                    </span>
                                    <span style="font-size: 0.8rem; color: var(--text-slate); display:flex; align-items:center; gap:8px;">
                                        <i class="fas fa-location-dot" style="color: #ef4444; font-size: 0.8rem;"></i> ${address}
                                    </span>
                                </div>
                            </td>
                            <td style="color: var(--text-slate); font-weight: 600; font-size: 0.9rem;">${date}</td>
                            <td>
                                <span style="background: #f1f5f9; padding: 6px 14px; border-radius: 10px; font-weight: 800; color: var(--text-main); font-size: 0.9rem;">
                                    ${orderCount} <small style="font-weight:400; opacity:0.6;">orders</small>
                                </span>
                            </td>
                            <td>
                                <div style="display: flex; gap: 8px;">
                                    <a href="tel:${phone}" class="action-btn btn-call" title="Call Customer">
                                        <i class="fas fa-phone"></i>
                                    </a>
                                    <a href="https://www.google.com/maps/search/${encodeURIComponent(address)}" target="_blank" class="action-btn btn-map" title="View Location">
                                        <i class="fas fa-map-marked-alt"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error("Database Error:", err);
                document.getElementById('userTableBody').innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align:center; padding: 60px;">
                            <i class="fas fa-triangle-exclamation" style="font-size: 2.5rem; color: #ef4444; margin-bottom: 15px;"></i>
                            <div style="font-weight: 700; color: #ef4444;">Connection Error</div>
                            <p style="color: var(--text-slate);">Database ချိတ်ဆက်မှု အဆင်မပြေပါ။ ခဏနေမှ ပြန်ကြိုးစားပါ။</p>
                        </td>
                    </tr>`;
            }
        }

        function filterTable() {
            const input = document.getElementById("userSearch");
            const filter = input.value.toUpperCase();
            const tr = document.getElementById("userTableBody").getElementsByTagName("tr");

            for (let i = 0; i < tr.length; i++) {
                const tdName = tr[i].getElementsByTagName("td")[0];
                const tdContact = tr[i].getElementsByTagName("td")[1];
                if (tdName || tdContact) {
                    const textValue = (tdName ? tdName.textContent : "") + (tdContact ? tdContact.textContent : "");
                    tr[i].style.display = textValue.toUpperCase().indexOf(filter) > -1 ? "" : "none";
                }
            }
        }

        function handleLogout() {
            if(confirm("အကောင့်ထဲမှ ထွက်မှာ သေချာပါသလား?")) {
                localStorage.removeItem('currentAgent');
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>
