<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Dashboard - Spider.io</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --primary: #6366f1; 
            --primary-dark: #4f46e5;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc; 
            --sidebar: #0f172a; 
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            display: flex; 
            color: var(--text-main);
            min-height: 100vh;
        }
        
        /* Sidebar Styles */
        .sidebar { 
            width: 260px; 
            background: var(--sidebar); 
            color: white; 
            height: 100vh; 
            padding: 2rem 1.2rem; 
            position: fixed; 
            z-index: 1000;
            box-sizing: border-box;
        }
        .sidebar h2 { 
            font-size: 1.5rem;
            margin-bottom: 2.5rem; 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            padding-left: 0.5rem;
        }
        .nav-item { 
            padding: 0.9rem 1.2rem; 
            border-radius: 12px; 
            color: #94a3b8; 
            text-decoration: none; 
            margin-bottom: 0.5rem; 
            display: flex; 
            align-items: center; 
            transition: all 0.3s ease; 
            font-weight: 600;
        }
        .nav-item:hover, .nav-item.active { 
            background: rgba(255, 255, 255, 0.08); 
            color: #fff; 
        }
        .nav-item.active { 
            background: var(--primary); 
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }
        .nav-item i { width: 24px; font-size: 1.1rem; margin-right: 10px; }

        /* Main Content Area */
        .main-content { 
            margin-left: 260px; 
            padding: 2rem 3rem; 
            width: calc(100% - 260px); 
            box-sizing: border-box;
        }

        /* Hero Welcome Section */
        .welcome-banner {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #818cf8 100%);
            border-radius: 24px;
            padding: 2.5rem;
            color: white;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.2);
        }
        .welcome-text h1 { margin: 0; font-size: 2rem; font-weight: 800; }
        .welcome-text p { margin: 8px 0 0; opacity: 0.9; font-size: 1rem; }

        .shop-link-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 16px;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .shop-link-box code { font-size: 0.85rem; }
        .btn-copy {
            background: white; color: var(--primary-dark);
            border: none; padding: 6px 15px; border-radius: 8px;
            font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn-copy:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        /* Stats Grid */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 1.5rem; 
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 20px;
            border: 1px solid #eef2ff;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            transition: 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .stat-icon {
            width: 45px; height: 45px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 1rem; font-size: 1.2rem;
        }
        .stat-val { font-size: 1.6rem; font-weight: 800; margin: 0; }
        .stat-label { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; }

        /* Dashboard Layout Grid */
        .dash-layout {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 1.5rem;
        }
        .chart-card, .orders-card {
            background: white; border-radius: 24px; padding: 1.8rem;
            border: 1px solid #eef2ff;
        }

        /* Table Design */
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { text-align: left; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; padding: 12px; border-bottom: 1px solid #f1f5f9; }
        td { padding: 14px 12px; font-size: 0.9rem; border-bottom: 1px solid #f8fafc; }
        
        .status { padding: 5px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; }
        .status-pending { background: #fff7ed; color: #c2410c; }
        .status-done { background: #f0fdf4; color: #166534; }

        /* Responsive */
        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .dash-layout { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .sidebar { width: 80px; padding: 2rem 0.5rem; }
            .sidebar span, .sidebar h2 span { display: none; }
            .main-content { margin-left: 80px; width: calc(100% - 80px); padding: 1.5rem; }
            .welcome-banner { flex-direction: column; align-items: flex-start; gap: 20px; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2><i class="fas fa-spider" style="color: var(--primary);"></i> <span>Spider.io</span></h2>
        <nav>
            <a id="navDash" class="nav-item active"><i class="fas fa-chart-pie"></i> <span>Dashboard</span></a>
            <a id="navInv" class="nav-item"><i class="fas fa-box-open"></i> <span>Inventory</span></a>
            <a id="navCust" class="nav-item"><i class="fas fa-users"></i> <span>Customers</span></a>
            <a id="navSettings" class="nav-item"><i class="fas fa-cog"></i> <span>Settings</span></a>
            
            <a href="#" onclick="handleLogout()" class="nav-item" style="margin-top: 3rem; color: var(--danger);">
                <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
            </a>
        </nav>
    </aside>

    <!-- Content -->
    <main class="main-content">
        <header class="welcome-banner">
            <div class="welcome-text">
                <h1 id="welcomeAgent">မင်္ဂလာပါ!</h1>
                <p>ဒီနေ့အတွက် သင့်ဆိုင်ရဲ့ အခြေအနေကို စစ်ဆေးကြည့်ပါ။</p>
            </div>
            <div class="shop-link-box">
                <i class="fas fa-globe"></i>
                <code id="shopLinkDisplay">loading...</code>
                <button class="btn-copy" onclick="copyShopLink()">Copy</button>
            </div>
        </header>

        <!-- Stats Section -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background: #eef2ff; color: var(--primary);"><i class="fas fa-shopping-cart"></i></div>
                <p class="stat-val" id="totalOrders">0</p>
                <p class="stat-label">Total Orders</p>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #ecfdf5; color: var(--success);"><i class="fas fa-cubes"></i></div>
                <p class="stat-val" id="totalProducts">0</p>
                <p class="stat-label">Total Items</p>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #fffbeb; color: var(--warning);"><i class="fas fa-hourglass-half"></i></div>
                <p class="stat-val" id="pendingOrders">0</p>
                <p class="stat-label">Wait for Delivery</p>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #fef2f2; color: var(--danger);"><i class="fas fa-wallet"></i></div>
                <p class="stat-val" id="totalRevenue">0</p>
                <p class="stat-label">Earnings (Ks)</p>
            </div>
        </div>

        <div class="dash-layout">
            <!-- Sales Chart -->
            <div class="chart-card">
                <h3 style="margin-top: 0;"><i class="fas fa-chart-line"></i> Sales Analytics</h3>
                <div style="height: 300px;">
                    <canvas id="salesChart"></canvas>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="orders-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3 style="margin: 0;"><i class="fas fa-history"></i> Recent Orders</h3>
                    <a href="user_list.html" style="color: var(--primary); font-size: 0.8rem; font-weight: 700; text-decoration: none;">See All</a>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="recentOrdersBody">
                        <tr><td colspan="2" style="text-align: center; padding: 2rem; color: var(--text-muted);">Loading orders...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCt1SMVSMqdX3u2viQ-n_BVwp6KgQwDLOM",
            authDomain: "my-shop-admin-cedb1.firebaseapp.com",
            projectId: "my-shop-admin-cedb1",
            storageBucket: "my-shop-admin-cedb1.firebasestorage.app",
            appId: "1:1073972515996:web:28049f5e5977e3a8e74959"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const agentName = urlParams.get('agent') || "spider";

        window.onload = () => {
            setupNavigation();
            loadStats();
            initSalesChart();
        };

        function setupNavigation() {
            const query = `?agent=${agentName}`;
            document.getElementById('navDash').href = `agent-dashboard.html${query}`;
            document.getElementById('navInv').href = `inventory.html${query}`;
            document.getElementById('navCust').href = `user_list.html${query}`;
            document.getElementById('navSettings').href = `shop-settings.html${query}`;

            const publicUrl = window.location.origin + "/index.html" + query;
            document.getElementById('shopLinkDisplay').innerText = publicUrl;
        }

        function loadStats() {
            // Shop Name
            db.collection("shop_settings").doc(agentName).onSnapshot(doc => {
                if(doc.exists) document.getElementById('welcomeAgent').innerText = `မင်္ဂလာပါ ${doc.data().shopName || agentName}!`;
            });

            // Products
            db.collection("products").where("agent_name", "==", agentName).onSnapshot(snap => {
                document.getElementById('totalProducts').innerText = snap.size;
            });

            // Orders
            db.collection("orders").where("agent_name", "==", agentName).onSnapshot(snap => {
                let total = snap.size;
                let pending = 0;
                let revenue = 0;
                
                const docs = snap.docs.map(d => d.data());
                docs.forEach(d => {
                    if(d.status === "Pending") pending++;
                    if(d.status === "Completed") revenue += (d.price || 0);
                });

                document.getElementById('totalOrders').innerText = total;
                document.getElementById('pendingOrders').innerText = pending;
                document.getElementById('totalRevenue').innerText = revenue.toLocaleString();

                renderRecentOrders(docs);
            });
        }

        function renderRecentOrders(orders) {
            const list = orders.slice(0, 6);
            const body = document.getElementById('recentOrdersBody');
            if(list.length === 0) {
                body.innerHTML = '<tr><td colspan="2" style="text-align:center;">No orders found</td></tr>';
                return;
            }
            body.innerHTML = list.map(o => `
                <tr>
                    <td style="font-weight:600;">${o.product_name}</td>
                    <td><span class="status ${o.status === 'Completed' ? 'status-done' : 'status-pending'}">${o.status}</span></td>
                </tr>
            `).join('');
        }

        function initSalesChart() {
            const ctx = document.getElementById('salesChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [{
                        label: 'Revenue (Ks)',
                        data: [15000, 22000, 18000, 35000, 30000, 48000, 60000],
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 3,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#6366f1',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { borderDash: [5, 5] } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function copyShopLink() {
            const link = document.getElementById('shopLinkDisplay').innerText;
            navigator.clipboard.writeText(link).then(() => {
                const btn = document.querySelector('.btn-copy');
                btn.innerText = "Copied!";
                setTimeout(() => btn.innerText = "Copy", 2000);
            });
        }

        function handleLogout() {
            if(confirm("Logout လုပ်မှာ သေချာပါသလား?")) window.location.href = "login.html";
        }
    </script>
</body>
</html>
