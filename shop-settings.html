<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Settings - Spider.io</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #4f46e5; 
            --primary-light: #eef2ff;
            --bg: #0f172a; 
            --main-bg: #f8fafc; 
            --text-main: #1e293b;
            --text-slate: #64748b; 
            --danger: #ef4444;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--main-bg); 
            margin: 0; 
            display: flex; 
            color: var(--text-main);
        }
        
        /* Sidebar */
        .sidebar { 
            width: 260px; 
            background: var(--bg); 
            color: white; 
            min-height: 100vh; 
            padding: 2rem 1rem; 
            position: fixed; 
            z-index: 1000; 
            box-sizing: border-box;
        }
        .sidebar h2 { 
            padding-left: 1rem; 
            margin-bottom: 3rem; 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            gap: 12px;
        }
        .nav-item { 
            padding: 1rem 1.2rem; 
            border-radius: 14px; 
            color: #94a3b8; 
            text-decoration: none; 
            margin-bottom: 0.6rem; 
            display: flex; 
            align-items: center; 
            font-weight: 600;
        }
        .nav-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .nav-item.active { background: var(--primary); color: white; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); }
        .nav-item i { width: 28px; font-size: 1.2rem; }

        /* Main Content */
        .main-content { margin-left: 260px; padding: 2.5rem; width: calc(100% - 260px); box-sizing: border-box; }
        
        .header-section { margin-bottom: 2rem; }
        .header-section h1 { margin: 0; font-size: 2rem; font-weight: 800; }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 2rem;
            align-items: start;
        }

        .card {
            background: white;
            border-radius: 28px;
            padding: 2rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--bg);
        }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-slate);
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            font-family: inherit;
            font-size: 0.95rem;
            transition: 0.2s;
            box-sizing: border-box;
        }
        .form-group input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px var(--primary-light); }

        /* Shop Profile Preview */
        .profile-preview {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(to bottom, var(--primary-light), #fff);
            border-radius: 24px;
            margin-bottom: 1.5rem;
        }
        .preview-avatar {
            width: 100px;
            height: 100px;
            background: var(--primary);
            color: white;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 auto 1.5rem;
            box-shadow: 0 15px 30px -5px rgba(79, 70, 229, 0.4);
        }

        .btn-save {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4); }

        @media (max-width: 1100px) {
            .settings-grid { grid-template-columns: 1fr; }
            .sidebar { width: 85px; padding: 2rem 0.5rem; }
            .sidebar span { display: none; }
            .main-content { margin-left: 85px; width: calc(100% - 85px); }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2><i class="fas fa-spider" style="color: var(--primary);"></i> <span>Spider.io</span></h2>
        <nav>
            <a id="navDash" class="nav-item"><i class="fas fa-grid-2"></i> <span>Dashboard</span></a>
            <a id="navInv" class="nav-item"><i class="fas fa-box-archive"></i> <span>Inventory</span></a>
            <a id="navCust" class="nav-item"><i class="fas fa-user-group"></i> <span>Customers</span></a>
            <a id="navSettings" class="nav-item active"><i class="fas fa-sliders"></i> <span>Settings</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="header-section">
            <h1>Shop Settings</h1>
            <p style="color: var(--text-slate);">ဆိုင်ရဲ့ အချက်အလက်များကို ဤနေရာတွင် စိတ်ကြိုက်ပြင်ဆင်ပါ</p>
        </div>

        <div class="settings-grid">
            <!-- Left: Preview -->
            <div class="card">
                <div class="profile-preview">
                    <div class="preview-avatar" id="avatarPreview">S</div>
                    <h2 id="previewName" style="margin: 0; font-size: 1.5rem;">Shop Name</h2>
                    <p id="previewAgent" style="color: var(--primary); font-weight: 700; margin: 5px 0;">@agent_id</p>
                    <div style="margin-top: 15px; display: flex; justify-content: center; gap: 10px;">
                        <span class="badge" style="background: #ecfdf5; color: #10b981; padding: 5px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: 800;">ACTIVE SHOP</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Quick Status</label>
                    <div style="display: flex; gap: 10px;">
                        <button style="flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0; background: white; font-weight: 700; cursor: pointer;"><i class="fas fa-eye"></i> Online</button>
                        <button style="flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0; background: white; font-weight: 700; cursor: pointer; color: var(--danger);"><i class="fas fa-eye-slash"></i> Offline</button>
                    </div>
                </div>
            </div>

            <!-- Right: Forms -->
            <div class="card">
                <div class="section-title"><i class="fas fa-id-card"></i> General Information</div>
                
                <div class="form-group">
                    <label>Shop Name (ဆိုင်နာမည်)</label>
                    <input type="text" id="shopName" placeholder="ဥပမာ - Spider Gadget Store" oninput="updatePreview()">
                </div>

                <div class="form-group">
                    <label>Phone Number (ဖုန်းနံပါတ်)</label>
                    <input type="tel" id="shopPhone" placeholder="09xxxxxxxxx">
                </div>

                <div class="form-group">
                    <label>Address (ဆိုင်လိပ်စာ)</label>
                    <textarea id="shopAddress" rows="3" placeholder="ဆိုင်တည်နေရာ အသေးစိတ်ရေးရန်"></textarea>
                </div>

                <div class="section-title" style="margin-top: 3rem;"><i class="fas fa-share-nodes"></i> Social & Payment</div>
                
                <div class="form-group">
                    <label>Viber Link / Number</label>
                    <input type="text" id="viberContact" placeholder="Viber အချက်အလက်">
                </div>

                <div class="form-group">
                    <label>KBZ Pay / Wave Pay (Payment Details)</label>
                    <input type="text" id="paymentDetails" placeholder="ငွေပေးချေမှု အချက်အလက်">
                </div>

                <div style="margin-top: 3rem;">
                    <button class="btn-save" onclick="saveSettings()">
                        <i class="fas fa-cloud-arrow-up"></i> Save Settings
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCt1SMVSMqdX3u2viQ-n_BVwp6KgQwDLOM",
            authDomain: "my-shop-admin-cedb1.firebaseapp.com",
            projectId: "my-shop-admin-cedb1",
            storageBucket: "my-shop-admin-cedb1.firebasestorage.app",
            appId: "1:1073972515996:web:28049f5e5977e3a8e74959"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const agentName = urlParams.get('agent') || "spider";

        window.onload = () => {
            const param = `?agent=${agentName}`;
            document.getElementById('navDash').href = `agent-dashboard.html${param}`;
            document.getElementById('navInv').href = `inventory.html${param}`;
            document.getElementById('navCust').href = `user_list.html${param}`;
            document.getElementById('navSettings').href = `shop-settings.html${param}`;
            
            document.getElementById('previewAgent').innerText = `@${agentName}`;
            loadSettings();
        };

        function loadSettings() {
            db.collection("shop_settings").doc(agentName).get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('shopName').value = data.shopName || "";
                    document.getElementById('shopPhone').value = data.phone || "";
                    document.getElementById('shopAddress').value = data.address || "";
                    document.getElementById('viberContact').value = data.viber || "";
                    document.getElementById('paymentDetails').value = data.payment || "";
                    updatePreview();
                }
            });
        }

        function updatePreview() {
            const name = document.getElementById('shopName').value || "Your Shop";
            document.getElementById('previewName').innerText = name;
            document.getElementById('avatarPreview').innerText = name.charAt(0).toUpperCase();
        }

        function saveSettings() {
            const btn = document.querySelector('.btn-save');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            
            const settings = {
                shopName: document.getElementById('shopName').value,
                phone: document.getElementById('shopPhone').value,
                address: document.getElementById('shopAddress').value,
                viber: document.getElementById('viberContact').value,
                payment: document.getElementById('paymentDetails').value,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("shop_settings").doc(agentName).set(settings, { merge: true })
            .then(() => {
                alert("Settings အားလုံးကို သိမ်းဆည်းပြီးပါပြီ!");
                btn.innerHTML = '<i class="fas fa-cloud-arrow-up"></i> Save Settings';
            })
            .catch((error) => {
                alert("အမှားအယွင်းရှိနေပါသည် - " + error.message);
                btn.innerHTML = '<i class="fas fa-cloud-arrow-up"></i> Save Settings';
            });
        }
    </script>
</body>
</html>
