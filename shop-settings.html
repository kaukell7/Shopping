<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Settings - Spider.io</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4f46e5; --bg: #0f172a; --card: #ffffff; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; margin: 0; display: flex; }
        .sidebar { width: 260px; background: var(--bg); color: white; min-height: 100vh; padding: 1.5rem 1rem; position: fixed; z-index: 9999; box-sizing: border-box; }
        .sidebar h2 { padding-left: 1rem; margin-bottom: 2.5rem; color: #fff; font-weight: 800; display: flex; align-items: center; gap: 12px; font-size: 1.4rem; }
        .nav-item { padding: 0.8rem 1rem; border-radius: 12px; color: #94a3b8; text-decoration: none; margin-bottom: 0.5rem; display: flex; align-items: center; transition: 0.3s; font-weight: 600; cursor: pointer; }
        .nav-item:hover { color: white; background: rgba(255,255,255,0.1); }
        .nav-item.active { background: var(--primary); color: white; }
        .main-content { margin-left: 260px; padding: 2.5rem; width: calc(100% - 260px); position: relative; box-sizing: border-box; }
        .settings-container { max-width: 700px; background: var(--card); padding: 2rem; border-radius: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: #1e293b; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; outline: none; transition: 0.3s; font-family: inherit; box-sizing: border-box; }
        .form-group input:focus { border-color: var(--primary); }
        .logo-upload-section { display: flex; align-items: center; gap: 20px; background: #f8fafc; padding: 1.5rem; border-radius: 16px; border: 2px dashed #e2e8f0; }
        .preview-box { width: 100px; height: 100px; background: white; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid #e2e8f0; }
        .preview-box img { width: 100%; height: 100%; object-fit: contain; }
        .save-btn { background: var(--primary); color: white; border: none; padding: 14px 28px; border-radius: 12px; cursor: pointer; font-weight: 700; width: 100%; font-size: 1rem; margin-top: 1rem; transition: 0.3s; }
        .save-btn:disabled { background: #94a3b8; cursor: not-allowed; opacity: 0.7; }
        @media (max-width: 900px) {
            .sidebar { width: 85px; padding: 1.5rem 0.5rem; }
            .sidebar h2 span, .nav-item span { display: none; }
            .main-content { margin-left: 85px; width: calc(100% - 85px); padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2><i class="fas fa-spider"></i> <span>Spider.io</span></h2>
        <a id="navDash" class="nav-item"><i class="fas fa-th-large"></i> &nbsp;<span>Dashboard</span></a>
        <a id="navInv" class="nav-item"><i class="fas fa-box"></i> &nbsp;<span>Inventory</span></a>
        <a id="navCust" class="nav-item"><i class="fas fa-users"></i> &nbsp;<span>Customers</span></a>
        <a id="navSettings" class="nav-item active"><i class="fas fa-store"></i> &nbsp;<span>Shop Settings</span></a>
        <a href="#" onclick="handleLogout()" class="nav-item" style="margin-top: 5rem; color: #fb7185;"><i class="fas fa-sign-out-alt"></i> &nbsp;<span>Logout</span></a>
    </div>

    <div class="main-content">
        <h1 style="color: #0f172a;">Shop Customization</h1>
        <p style="color: #64748b; margin-bottom: 2rem;">သင့်ဆိုင်ရဲ့ Logo နဲ့ အချက်အလက်တွေကို ဒီမှာပြင်ဆင်နိုင်ပါတယ်</p>

        <div class="settings-container">
            <div class="form-group">
                <label>Shop Logo</label>
                <div class="logo-upload-section">
                    <div class="preview-box" id="logoPreview">
                        <i class="fas fa-image" style="color: #cbd5e1; font-size: 2rem;"></i>
                    </div>
                    <div>
                        <input type="file" id="logoFile" accept="image/*" onchange="handlePreview(event)">
                        <p style="font-size: 12px; color: #94a3b8; margin-top: 8px;">ပုံ Size အရမ်းမကြီးပါစေနှင့် (Max: 2MB)</p>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Shop Name (ဆိုင်နာမည်)</label>
                <input type="text" id="shopName" placeholder="ဥပမာ - Spider Fashion House">
            </div>

            <div class="form-group">
                <label>Viber Number (ဆက်သွယ်ရန်ဖုန်း)</label>
                <input type="text" id="viberPhone" placeholder="09xxxxxxxxx">
            </div>
            <div class="form-group">
                <label>Telegram Link (တယ်လီဂရမ် လင့်ခ်)</label>
                <input type="text" id="telegramLink" placeholder="t.me/yourusername">
            </div>
            <button class="save-btn" id="saveBtn" onclick="saveToMongoDB()">Save Changes</button>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://shopping-sable-sigma.vercel.app";
        let currentAgentName = "";
        let existingLogoUrl = "";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const agentFromUrl = urlParams.get('agent');
            const agentData = JSON.parse(localStorage.getItem('currentAgent'));
            
            currentAgentName = agentFromUrl || (agentData ? agentData.name : null);

            if (!currentAgentName) {
                window.location.href = "login.html";
                return;
            }

            const param = `?agent=${encodeURIComponent(currentAgentName)}`;
            document.getElementById('navDash').href = `agent-dashboard.html${param}`;
            document.getElementById('navInv').href = `inventory.html${param}`;
            document.getElementById('navCust').href = `user_list.html${param}`;
            document.getElementById('navSettings').href = `shop-settings.html${param}`;

            loadOldSettings();
        };

        async function loadOldSettings() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/settings/${currentAgentName}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data) {
                        document.getElementById('shopName').value = data.shopName || "";
                        document.getElementById('viberPhone').value = data.viber || "";
                        document.getElementById('telegramLink').value = data.telegram || "";
                        if(data.logoUrl) {
                            existingLogoUrl = data.logoUrl;
                            document.getElementById('logoPreview').innerHTML = `<img src="${data.logoUrl}" style="width:100%; height:100%; object-fit:contain;">`;
                        }
                    }
                }
            } catch (err) {
                console.error("Data loading error:", err);
            }
        }

        function handlePreview(event) {
            const file = event.target.files[0];
            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    alert("ပုံ Size အရမ်းကြီးနေပါသည်။ 2MB အောက်ပုံကို ရွေးပေးပါ။");
                    event.target.value = "";
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('logoPreview').innerHTML = `<img src="${e.target.result}" style="width:100%; height:100%; object-fit:contain;">`;
                };
                reader.readAsDataURL(file);
            }
        }

        async function saveToMongoDB() {
            const btn = document.getElementById('saveBtn');
            const file = document.getElementById('logoFile').files[0];
            const name = document.getElementById('shopName').value;
            const viber = document.getElementById('viberPhone').value;
            const telegram = document.getElementById('telegramLink').value;

            if(!name || !viber) return alert("ဆိုင်နာမည်နှင့် Viber နံပါတ် ထည့်ပေးရန် လိုအပ်ပါသည်။");

            btn.disabled = true;
            btn.innerText = "Saving...";

            try {
                let logoUrl = existingLogoUrl;

                if (file) {
                    logoUrl = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                }

                const payload = {
                    agentName: currentAgentName,
                    shopName: name,
                    viber: viber,
                    telegram: telegram,
                    logoUrl: logoUrl
                };

                const response = await fetch(`${BACKEND_URL}/api/settings/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ။");
                    window.location.reload();
                } else {
                    const errorData = await response.json().catch(() => ({ message: "Unknown error" }));
                    alert("သိမ်းဆည်း၍မရပါ- " + (errorData.message || "Server Error"));
                }

            } catch (err) {
                console.error("Save Error:", err);
                alert("ချိတ်ဆက်မှု အမှားအယွင်းရှိနေပါသည် (Vercel Backend ကို စစ်ဆေးပါ)");
            } finally {
                btn.disabled = false;
                btn.innerText = "Save Changes";
            }
        }

        function handleLogout() {
            localStorage.removeItem('currentAgent');
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
