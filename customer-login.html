<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Spider.io</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        .login-card { background: white; padding: 2.5rem; border-radius: 30px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo { font-size: 2.5rem; color: var(--primary); font-weight: 800; margin-bottom: 1rem; display: block; }
        h2 { margin-bottom: 0.5rem; color: #0f172a; font-size: 1.4rem; font-weight: 700; }
        p.desc { color: #64748b; font-size: 0.9rem; margin-bottom: 2rem; }

        .input-group { text-align: left; margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.5rem; color: #475569; }
        input { width: 100%; padding: 14px 16px; border: 1px solid #e2e8f0; border-radius: 14px; outline: none; background: #f8fafc; transition: 0.3s; box-sizing: border-box; font-family: inherit; }
        input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 1rem; margin-top: 10px; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4); }
        .btn-main:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .toggle-text { margin-top: 1.5rem; font-size: 0.9rem; color: #64748b; }
        /* ဒီနေရာမှာ Span ကိုနှိပ်လို့ရအောင် style ပြင်ထားပါတယ် */
        .toggle-btn { color: var(--primary); font-weight: 700; cursor: pointer; text-decoration: underline; margin-left: 5px; }

        .error-msg { 
            color: #ef4444; 
            font-size: 0.85rem; 
            margin-top: 15px; 
            display: none; 
            text-align: left; 
            background: #fef2f2; 
            padding: 12px; 
            border-radius: 10px;
            border: 1px solid #fee2e2;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo"><i class="fas fa-spider"></i></div>
    <h2 id="formTitle">မင်္ဂလာပါ</h2>
    <p class="desc" id="formDesc">ဆက်လက်လုပ်ဆောင်ရန် အကောင့်ဝင်ပေးပါ။</p>

    <!-- အကောင့်ဖွင့်မှသာ ပေါ်မည့် နာမည်ဖြည့်သွင်းရန် နေရာ -->
    <div id="registerFields" style="display: none;">
        <div class="input-group">
            <label>နာမည်အပြည့်အစုံ</label>
            <input type="text" id="custName" placeholder="ဥပမာ - မောင်မောင်">
        </div>
    </div>

    <div class="input-group">
        <label>Email သို့မဟုတ် ဖုန်းနံပါတ်</label>
        <input type="text" id="custIdentifier" placeholder="Email သို့မဟုတ် ဖုန်းနံပါတ် ထည့်ပါ">
    </div>

    <div class="input-group">
        <label>လျှို့ဝှက်နံပါတ်</label>
        <input type="password" id="custPassword" placeholder="အနည်းဆုံး ၆ လုံး">
    </div>

    <button class="btn-main" id="mainBtn" onclick="handleAuth()">Login ဝင်မည်</button>

    <div id="errorBox" class="error-msg"></div>

    <div class="toggle-text" id="toggleArea">
        အကောင့်မရှိသေးဘူးလား? <span class="toggle-btn" onclick="toggleForm()">အသစ်ဖွင့်မည်</span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Supabase အချက်အလက်များ (သင့် Project Key များ ထည့်ရန်)
    const SUPABASE_URL = 'သင့်ရဲ့_SUPABASE_URL_ဒီမှာထည့်ပါ'; 
    const SUPABASE_KEY = 'သင့်ရဲ့_SUPABASE_ANON_KEY_ဒီမှာထည့်ပါ';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const agentName = urlParams.get('agent') || "spider"; 

    let isLogin = true; 

    // Login နဲ့ Register ပုံစံ ပြောင်းလဲပေးသည့် Function
    function toggleForm() {
        isLogin = !isLogin;
        const errorBox = document.getElementById('errorBox');
        errorBox.style.display = 'none';
        
        document.getElementById('formTitle').innerText = isLogin ? "မင်္ဂလာပါ" : "အကောင့်သစ်ဖွင့်မည်";
        document.getElementById('formDesc').innerText = isLogin ? "ဆက်လက်လုပ်ဆောင်ရန် အကောင့်ဝင်ပေးပါ။" : "ဈေးဝယ်ရန်အတွက် အကောင့်အရင်ဖွင့်ပေးပါ။";
        document.getElementById('registerFields').style.display = isLogin ? "none" : "block";
        document.getElementById('mainBtn').innerText = isLogin ? "Login ဝင်မည်" : "အကောင့်ဖွင့်မည်";
        
        const toggleArea = document.getElementById('toggleArea');
        if (isLogin) {
            toggleArea.innerHTML = 'အကောင့်မရှိသေးဘူးလား? <span class="toggle-btn" onclick="toggleForm()">အသစ်ဖွင့်မည်</span>';
        } else {
            toggleArea.innerHTML = 'အကောင့်ရှိပြီးသားလား? <span class="toggle-btn" onclick="toggleForm()">Login ပြန်ဝင်မည်</span>';
        }
    }

    async function handleAuth() {
        const identifier = document.getElementById('custIdentifier').value.trim();
        const password = document.getElementById('custPassword').value;
        const name = document.getElementById('custName').value.trim();
        const btn = document.getElementById('mainBtn');
        const errorBox = document.getElementById('errorBox');

        if(!identifier || !password) return showError("Email/ဖုန်း နှင့် Password ဖြည့်ပါ။");
        if(!isLogin && !name) return showError("သင့်နာမည်ကို ဖြည့်ပေးပါ။");
        if(password.length < 6) return showError("Password သည် အနည်းဆုံး ၆ လုံးရှိရပါမည်။");

        // ဖုန်းနံပါတ် သီးသန့်သုံးသူများအတွက် Virtual Email ဖန်တီးခြင်း
        let emailToUse = identifier.includes('@') ? identifier : identifier + "@spider.io";

        btn.disabled = true;
        btn.innerText = "ခဏစောင့်ပါ...";
        errorBox.style.display = 'none';

        try {
            if (isLogin) {
                const { data, error: loginError } = await _supabase.auth.signInWithPassword({
                    email: emailToUse,
                    password: password,
                });
                if (loginError) throw loginError;
            } else {
                const { data, error: authError } = await _supabase.auth.signUp({
                    email: emailToUse,
                    password: password,
                });
                
                if (authError) throw authError;
                if (!data.user) throw new Error("Registration failed.");

                // Database ထဲသို့ Customer အချက်အလက် သိမ်းဆည်းခြင်း
                const { error: dbError } = await _supabase
                    .from('customers')
                    .insert([{ 
                        id: data.user.id,
                        name: name, 
                        phone_or_email: identifier,
                        agent_name: agentName.toLowerCase() 
                    }]);
                
                if (dbError) throw dbError;
                alert("အကောင့်ဖွင့်ခြင်း အောင်မြင်ပါသည်။");
            }

            // အောင်မြင်ပါက index.html သို့ သွားမည်
            window.location.href = "index.html" + window.location.search;

        } catch (error) {
            let msg = error.message;
            if(msg === "Invalid login credentials") msg = "အီးမေးလ် သို့မဟုတ် လျှို့ဝှက်နံပါတ် မှားယွင်းနေပါသည်။";
            showError(msg);
            btn.disabled = false;
            btn.innerText = isLogin ? "Login ဝင်မည်" : "အကောင့်ဖွင့်မည်";
        }
    }

    function showError(text) {
        const errorBox = document.getElementById('errorBox');
        errorBox.innerText = text;
        errorBox.style.display = 'block';
    }
</script>

</body>
</html>
