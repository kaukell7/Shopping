<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Spider.io</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-card { background: white; padding: 2.5rem; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        .logo { text-align: center; margin-bottom: 2rem; font-weight: 800; font-size: 1.5rem; color: var(--primary); }
        h2 { text-align: center; margin-bottom: 1.5rem; font-size: 1.2rem; }
        
        .input-wrapper { position: relative; margin-bottom: 1rem; }
        input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.05); }
        
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .toggle-text { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #64748b; }
        .toggle-text span { color: var(--primary); cursor: pointer; font-weight: 600; }
        
        .error-msg { 
            color: #ef4444; 
            font-size: 0.8rem; 
            margin-top: 15px; 
            display: none; 
            text-align: left; 
            background: #fef2f2; 
            padding: 10px; 
            border-radius: 8px;
            border: 1px solid #fee2e2;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo">Spider.io</div>
    <h2 id="formTitle">အကောင့်အသစ်ဖွင့်ရန်</h2>
    
    <div id="registerFields">
        <div class="input-wrapper">
            <input type="text" id="custName" placeholder="နာမည်အပြည့်အစုံ">
        </div>
    </div>

    <div class="input-wrapper">
        <input type="text" id="custIdentifier" placeholder="ဖုန်းနံပါတ် သို့မဟုတ် Email">
    </div>

    <div class="input-wrapper">
        <input type="password" id="custPassword" placeholder="စကားဝှက် (အနည်းဆုံး ၆ လုံး)">
    </div>
    
    <button id="mainBtn" onclick="handleAuth()">အကောင့်ဖွင့်မည်</button>
    
    <div id="errorBox" class="error-msg"></div>
    
    <p class="toggle-text" id="toggleMsg">အကောင့်ရှိပြီးသားလား? <span onclick="toggleForm()">Login ပြန်ဝင်မည်</span></p>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // image_0c4b9d.png ထဲက Project URL နဲ့ Anon Key ကို ဒီနေရာမှာ အစားထိုးထည့်ပါ
    const SUPABASE_URL = 'သင့်ရဲ့_SUPABASE_URL_ဒီမှာထည့်ပါ'; 
    const SUPABASE_KEY = 'သင့်ရဲ့_SUPABASE_ANON_KEY_ဒီမှာထည့်ပါ';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const agentName = urlParams.get('agent') || "spider"; 

    let isLogin = false; 

    function toggleForm() {
        isLogin = !isLogin;
        document.getElementById('formTitle').innerText = isLogin ? "Login ဝင်ရန်" : "အကောင့်အသစ်ဖွင့်ရန်";
        document.getElementById('mainBtn').innerText = isLogin ? "Login ဝင်မည်" : "အကောင့်ဖွင့်မည်";
        document.getElementById('registerFields').style.display = isLogin ? "none" : "block";
        document.getElementById('toggleMsg').innerHTML = isLogin ? 
            'အကောင့်မရှိသေးဘူးလား? <span onclick="toggleForm()">အကောင့်ဖွင့်မည်</span>' : 
            'အကောင့်ရှိပြီးသားလား? <span onclick="toggleForm()">Login ပြန်ဝင်မည်</span>';
        document.getElementById('errorBox').style.display = 'none';
    }

    async function handleAuth() {
        const identifier = document.getElementById('custIdentifier').value.trim();
        const password = document.getElementById('custPassword').value;
        const name = document.getElementById('custName').value.trim();
        const btn = document.getElementById('mainBtn');
        const errorBox = document.getElementById('errorBox');

        if(!identifier || !password || (!isLogin && !name)) {
            showError("အချက်အလက်များ ပြည့်စုံစွာ ဖြည့်ပါ။");
            return;
        }

        // Email ပုံစံမဟုတ်ရင် @spider.io ပေါင်းထည့်ပေးခြင်း
        let emailToUse = identifier.includes('@') ? identifier : identifier + "@spider.io";

        btn.disabled = true;
        btn.innerText = "ခဏစောင့်ပါ...";
        errorBox.style.display = 'none';

        try {
            if (isLogin) {
                // Supabase Login
                const { error } = await _supabase.auth.signInWithPassword({
                    email: emailToUse,
                    password: password,
                });
                if (error) throw error;
            } else {
                // Supabase Register
                const { data, error: authError } = await _supabase.auth.signUp({
                    email: emailToUse,
                    password: password,
                });
                if (authError) throw authError;
                if (!data.user) throw new Error("Registration failed.");

                // Customer အချက်အလက်ကို Table ထဲသိမ်းခြင်း
                const { error: dbError } = await _supabase
                    .from('customers')
                    .insert([{ 
                        id: data.user.id,
                        name: name, 
                        phone_or_email: identifier,
                        agent_name: agentName.toLowerCase() 
                    }]);
                if (dbError) throw dbError;
            }
            // အောင်မြင်ရင် index.html ကို ပြန်သွားမယ်
            window.location.href = "index.html" + window.location.search;
        } catch (error) {
            showError("မှားယွင်းနေပါသည်။ " + (error.description || error.message));
            btn.disabled = false;
            btn.innerText = isLogin ? "Login ဝင်မည်" : "အကောင့်ဖွင့်မည်";
        }
    }

    function showError(text) {
        const errorBox = document.getElementById('errorBox');
        errorBox.innerText = text;
        errorBox.style.display = 'block';
    }

    // Default အနေနဲ့ Login ပြထားချင်ရင် အောက်က line ကို isLogin = true; ထားပါ
    isLogin = true; 
    toggleForm(); 
</script>

</body>
</html>
