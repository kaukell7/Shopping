<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - Spider.io</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #4f46e5; --bg: #1e293b; --card-bg: #ffffff; --text-main: #1e293b; --text-sub: #64748b; --danger: #ef4444; --success: #10b981; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; margin: 0; display: flex; }

        .sidebar { width: 260px; background: var(--bg); color: white; min-height: 100vh; padding: 2rem 1rem; position: fixed; z-index: 1000; }
        .sidebar h2 { margin-bottom: 2rem; padding-left: 1rem; font-weight: 800; }
        .nav-item { padding: 0.8rem 1rem; border-radius: 8px; color: #cbd5e1; text-decoration: none; margin-bottom: 0.5rem; display: flex; align-items: center; transition: 0.3s; font-weight: 600; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }

        .main-content { margin-left: 280px; padding: 2.5rem; width: calc(100% - 280px); }
        .card { background: var(--card-bg); padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 2.5rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem; }
        
        .input-group { display: flex; flex-direction: column; gap: 0.6rem; }
        label { font-weight: 600; font-size: 0.9rem; color: var(--text-main); }
        input { padding: 0.9rem; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.9rem; transition: 0.3s; }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        .btn-create { background: var(--primary); color: white; padding: 0.9rem 2rem; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 0.6rem; transition: 0.2s; }
        .btn-create:hover { background: #4338ca; }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { text-align: left; padding: 1rem; border-bottom: 2px solid #f1f5f9; color: var(--text-sub); font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 1rem; border-bottom: 1px solid #f1f5f9; font-size: 0.95rem; }
        .status-badge { padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .status-active { background: #dcfce7; color: #166534; }
        .status-disabled { background: #fee2e2; color: #991b1b; }
        
        .action-btn { border: none; background: none; cursor: pointer; padding: 5px; font-size: 1rem; transition: 0.2s; margin-right: 8px; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-view { color: #6366f1; }
        .btn-delete { color: var(--danger); }
        .agent-name-link { color: var(--primary); text-decoration: none; font-weight: 700; transition: 0.2s; }
        .agent-name-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Spider.io</h2>
        <a href="super-admin.html" class="nav-item active"><i class="fas fa-users"></i> &nbsp; User List</a>
        <a href="analytics.html" class="nav-item"><i class="fas fa-chart-line"></i> &nbsp; Analytics</a>
    </div>

    <div class="main-content">
        <h1>Super Admin Control</h1>

        <div class="card">
            <h3>Register New Agent</h3>
            <div class="form-grid">
                <div class="input-group">
                    <label>Shop Name</label>
                    <input type="text" id="shopName" placeholder="Enter shop name">
                </div>
                <div class="input-group">
                    <label>Gmail / Phone</label>
                    <input type="text" id="contact" placeholder="Email or Phone">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Create password">
                </div>
            </div>
            <button class="btn-create" onclick="createAgent()">
                <i class="fas fa-plus"></i> Create Agent
            </button>
        </div>

        <div class="card">
            <h3>Manage Agents</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Shop Name</th>
                            <th>Contact</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="agentTableBody">
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Vercel Backend URL
        const API_BASE_URL = "https://shopping-sable-sigma.vercel.app/api/agents";

        // စာမျက်နှာ စဖွင့်တာနဲ့ Agent List ကို ဆွဲထုတ်မယ်
        document.addEventListener('DOMContentLoaded', loadAgents);

        // ၁။ Agent အသစ်ဖွင့်သည့် Function
        async function createAgent() {
            const shopName = document.getElementById('shopName').value.trim();
            const contact = document.getElementById('contact').value.trim();
            const password = document.getElementById('password').value.trim();

            if(!shopName || !contact || !password) {
                alert("အချက်အလက် အားလုံး ဖြည့်ပေးပါ");
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shopName, contact, password })
                });

                const data = await response.json();
                if (data.success) {
                    alert("Agent အကောင့် အောင်မြင်စွာ ဖွင့်ပြီးပါပြီ");
                    document.getElementById('shopName').value = '';
                    document.getElementById('contact').value = '';
                    document.getElementById('password').value = '';
                    loadAgents(); // စာရင်းပြန်ပြမယ်
                } else {
                    alert("အမှားအယွင်းရှိပါသည်: " + (data.error || "Duplicate account"));
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Backend နှင့် ချိတ်ဆက်၍ မရပါ");
            }
        }

        // ၂။ Agent List ကို ပြသပေးမည့် Function
        async function loadAgents() {
            try {
                const response = await fetch(`${API_BASE_URL}/list`);
                const agents = await response.json();
                
                const tbody = document.getElementById('agentTableBody');
                tbody.innerHTML = '';

                agents.forEach(agent => {
                    const agentLink = `agent-dashboard.html?agent=${encodeURIComponent(agent.shopName)}`;
                    
                    tbody.innerHTML += `
                        <tr>
                            <td>
                                <a href="${agentLink}" class="agent-name-link">
                                    <i class="fas fa-external-link-alt" style="font-size: 0.7rem;"></i> ${agent.shopName}
                                </a>
                            </td>
                            <td>${agent.contact}</td>
                            <td><span class="status-badge status-active">${agent.status || 'Active'}</span></td>
                            <td>
                                <a href="${agentLink}" class="action-btn btn-view" title="View Dashboard">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <button class="action-btn btn-delete" onclick="deleteAgent('${agent._id}')" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Load Agents Error:", error);
            }
        }

        // ၃။ Agent ဖျက်သည့် Function
        async function deleteAgent(id) {
            if(!confirm("ဤအကောင့်ကို ဖျက်ပစ်ရန် သေချာပါသလား?")) return;

            try {
                const response = await fetch(`${API_BASE_URL}/${id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (data.success) {
                    loadAgents(); // List ကို update လုပ်မယ်
                }
            } catch (error) {
                alert("ဖျက်၍ မရပါ");
            }
        }
    </script>
</body>
</html>
