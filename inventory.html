<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products - Spider.io</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #4f46e5; 
            --primary-hover: #4338ca;
            --bg: #f8fafc; 
            --sidebar: #0f172a; 
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            display: flex; 
            color: var(--text-main);
        }
        
        /* Sidebar Styling */
        .sidebar { 
            width: 260px; 
            background: var(--sidebar); 
            color: white; 
            min-height: 100vh; 
            padding: 2rem 1rem; 
            position: fixed; 
            transition: all 0.3s ease;
            z-index: 1000; 
        }
        .sidebar h2 { 
            padding-left: 1rem; 
            margin-bottom: 2.5rem; 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            letter-spacing: -0.5px;
        }
        .nav-item { 
            padding: 0.8rem 1.2rem; 
            border-radius: 12px; 
            color: #94a3b8; 
            text-decoration: none; 
            margin-bottom: 0.5rem; 
            display: flex; 
            align-items: center; 
            transition: 0.2s; 
            cursor: pointer;
            font-weight: 500;
        }
        .nav-item:hover, .nav-item.active { 
            background: rgba(79, 70, 229, 0.1); 
            color: #fff; 
        }
        .nav-item.active {
            background: var(--primary);
        }
        .nav-item i { width: 24px; font-size: 1.1rem; }
        
        /* Layout */
        .main-content { 
            margin-left: 260px; 
            padding: 2.5rem; 
            width: calc(100% - 260px); 
            min-height: 100vh;
        }
        .grid-container { 
            display: grid; 
            grid-template-columns: 400px 1fr; 
            gap: 2rem; 
            align-items: start; 
        }
        
        /* Cards & Forms */
        .card { 
            background: white; 
            padding: 2rem; 
            border-radius: 24px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02), 0 10px 15px -3px rgba(0,0,0,0.05);
            border: 1px solid rgba(226, 232, 240, 0.8); 
        }
        .form-group { margin-bottom: 1.25rem; }
        label { 
            display: block; 
            margin-bottom: 0.6rem; 
            font-weight: 600; 
            font-size: 0.85rem; 
            color: var(--text-main);
        }
        input, select { 
            width: 100%; 
            padding: 0.8rem 1rem; 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: 0.2s;
        }
        input:focus { 
            outline: none;
            border-color: var(--primary); 
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); 
        }
        
        /* Image Upload Preview */
        .img-preview-box { 
            width: 100%; 
            height: 200px; 
            border: 2px dashed #cbd5e1; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            margin-bottom: 1.5rem; 
            overflow: hidden; 
            background: #f1f5f9; 
            cursor: pointer; 
            transition: 0.3s;
        }
        .img-preview-box:hover { border-color: var(--primary); background: #eef2ff; }
        .img-preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .img-preview-box i { font-size: 2rem; color: #94a3b8; margin-bottom: 8px; }
        .img-preview-box span { font-size: 0.8rem; color: #64748b; }

        /* Inventory Table */
        .table-card { 
            background: white; 
            border-radius: 24px; 
            border: 1px solid rgba(226, 232, 240, 0.8); 
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }
        table { width: 100%; border-collapse: collapse; }
        th { 
            background: #f8fafc; 
            padding: 1rem; 
            text-align: left; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            color: #64748b;
            border-bottom: 1px solid #f1f5f9;
        }
        td { padding: 1.2rem 1rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .product-info { display: flex; align-items: center; gap: 14px; }
        .product-img { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: #f1f5f9; }
        
        .price-tag { font-weight: 700; color: #0f172a; font-size: 1rem; }
        .discount-badge { 
            background: #fff1f2; 
            color: #e11d48; 
            padding: 2px 8px; 
            border-radius: 6px; 
            font-size: 0.7rem; 
            font-weight: 700; 
            margin-left: 5px;
        }

        .btn-create { 
            background: var(--primary); 
            color: white; 
            padding: 1rem; 
            border: none; 
            border-radius: 14px; 
            font-weight: 700; 
            font-size: 1rem;
            cursor: pointer; 
            width: 100%; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
        .btn-create:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-create:disabled { background: #94a3b8; transform: none; }

        .btn-delete { 
            color: #94a3b8; 
            cursor: pointer; 
            border: 1px solid #e2e8f0; 
            background: white; 
            padding: 8px; 
            border-radius: 10px; 
            transition: 0.2s;
        }
        .btn-delete:hover { color: #ef4444; border-color: #fecaca; background: #fef2f2; }

        /* Mobile Responsive */
        @media (max-width: 1100px) {
            .grid-container { grid-template-columns: 1fr; }
            .sidebar { width: 80px; padding: 2rem 0.5rem; }
            .sidebar h2 span, .sidebar .nav-item span { display: none; }
            .sidebar .nav-item { justify-content: center; padding: 1rem; }
            .main-content { margin-left: 80px; width: calc(100% - 80px); }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2><i class="fas fa-spider" style="color: var(--primary);"></i> <span>Spider.io</span></h2>
        <a id="navDash" class="nav-item"><i class="fas fa-th-large"></i> <span>Dashboard</span></a>
        <a id="navInv" class="nav-item active"><i class="fas fa-box"></i> <span>My Products</span></a>
        <a id="navUsers" class="nav-item"><i class="fas fa-users"></i> <span>Customers</span></a>
        <a id="navSettings" class="nav-item"><i class="fas fa-cog"></i> <span>Settings</span></a>
        
        <button class="nav-item" onclick="handleLogout()" style="margin-top: auto; border: none; background: transparent; width: 100%; color: #fb7185;">
            <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
        </button>
    </div>

    <div class="main-content">
        <header style="margin-bottom: 2.5rem;">
            <h1 id="pageTitle" style="font-size: 1.8rem; margin: 0 0 0.5rem 0; letter-spacing: -0.5px;">Product Management</h1>
            <p id="pageSub" style="color: var(--text-muted); margin: 0;">သင့်ဆိုင်ရှိ ကုန်ပစ္စည်းများကို အလွယ်တကူ စီမံခန့်ခွဲပါ</p>
        </header>
        
        <div class="grid-container">
            <!-- Add Product Form -->
            <div class="card">
                <h3 style="margin: 0 0 1.5rem 0; font-size: 1.1rem; display: flex; align-items: center; gap: 10px;">
                    <i class="fas fa-plus-circle" style="color: var(--primary);"></i> Add New Product
                </h3>
                
                <form id="productForm">
                    <label>Product Image</label>
                    <div class="img-preview-box" id="previewContainer" onclick="document.getElementById('pImageFile').click()">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>Click to upload image</span>
                    </div>
                    <input type="file" id="pImageFile" accept="image/*" onchange="previewImage(event)" style="display: none;" required>

                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" id="pName" placeholder="ဥပမာ - နွေရာသီဝတ် ဂါဝန်" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Category</label>
                        <select id="pCategory">
                            <option value="Boy">Boy</option>
                            <option value="Girl">Girl</option>
                            <option value="Kid">Kid</option>
                            <option value="Accessories">Accessories</option>
                        </select>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label>Price (Ks)</label>
                            <input type="number" id="originalPrice" placeholder="50000" min="0" required oninput="calculateDiscount()">
                        </div>
                        <div class="form-group">
                            <label>Discount (%)</label>
                            <input type="number" id="discountPercent" value="0" min="0" max="100" oninput="calculateDiscount()">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Final Selling Price (ရောင်းဈေး)</label>
                        <input type="number" id="finalPrice" style="background:#f8fafc; font-weight:700; color: var(--primary);" readonly>
                    </div>
                    
                    <button type="submit" class="btn-create" id="uploadBtn">
                        <i class="fas fa-check-circle"></i> Save Product
                    </button>
                </form>
            </div>

            <!-- Inventory List -->
            <div class="table-card">
                <div style="padding: 1.5rem; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="margin: 0; font-size: 1.1rem;">My Inventory</h3>
                    <span id="productCount" style="background: #eef2ff; color: var(--primary); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700;">0 Items</span>
                </div>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Product Details</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th style="text-align: center;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody">
                            <tr>
                                <td colspan="4" style="text-align:center; padding: 60px; color: #94a3b8;">
                                    <i class="fas fa-circle-notch fa-spin" style="font-size: 2rem; margin-bottom: 15px; color: var(--primary);"></i><br>
                                    Loading Products...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://shopping-sable-sigma.vercel.app/api";
        let currentAgentName = "";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const agentFromUrl = urlParams.get('agent');
            const loggedInAgent = JSON.parse(localStorage.getItem('currentAgent'));
            
            currentAgentName = agentFromUrl || (loggedInAgent ? loggedInAgent.name : null);

            if (!currentAgentName) {
                window.location.href = "login.html";
                return;
            }

            // Update Navigation Links
            const suffix = `?agent=${encodeURIComponent(currentAgentName)}`;
            document.getElementById('navDash').href = `agent-dashboard.html${suffix}`;
            document.getElementById('navInv').href = `inventory.html${suffix}`;
            document.getElementById('navUsers').href = `user_list.html${suffix}`;
            document.getElementById('navSettings').href = `shop-settings.html${suffix}`;
            
            document.getElementById('pageTitle').innerText = `${currentAgentName}'s Store`;

            fetchMyProducts();
        };

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('previewContainer').innerHTML = `<img src="${e.target.result}">`;
                };
                reader.readAsDataURL(file);
            }
        }

        function calculateDiscount() {
            const original = parseFloat(document.getElementById('originalPrice').value) || 0;
            const percent = parseFloat(document.getElementById('discountPercent').value) || 0;
            const discountAmount = (original * percent / 100);
            document.getElementById('finalPrice').value = Math.max(0, Math.round(original - discountAmount));
        }

        async function fetchMyProducts() {
            const tbody = document.getElementById('productTableBody');
            try {
                const response = await fetch(`${API_BASE_URL}/products?agent=${encodeURIComponent(currentAgentName)}`);
                const products = await response.json();
                
                document.getElementById('productCount').innerText = `${products.length} Items`;

                if (!products || products.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:60px; color:#94a3b8;">ပစ္စည်းစာရင်း မရှိသေးပါ။</td></tr>';
                    return;
                }

                tbody.innerHTML = products.map(p => {
                    const hasDiscount = p.discountPercent > 0;
                    return `
                        <tr>
                            <td>
                                <div class="product-info">
                                    <img src="${p.imageUrl || 'https://via.placeholder.com/60'}" class="product-img" onerror="this.src='https://via.placeholder.com/60'">
                                    <div>
                                        <div style="font-weight:700; color:#0f172a;">${p.name}</div>
                                        <div style="font-size:0.75rem; color:#94a3b8; margin-top:2px;">ID: ${p._id.slice(-6).toUpperCase()}</div>
                                    </div>
                                </div>
                            </td>
                            <td><span style="background:#f1f5f9; color:#475569; padding:5px 12px; border-radius:8px; font-size:0.8rem; font-weight:600;">${p.category}</span></td>
                            <td>
                                <div class="price-tag">${(p.price || 0).toLocaleString()} Ks</div>
                                ${hasDiscount ? `<span class="discount-badge">-${p.discountPercent}%</span>` : ''}
                            </td>
                            <td style="text-align: center;">
                                <button class="btn-delete" onclick="deleteProduct('${p._id}')" title="Delete">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#ef4444; padding:40px;">Connection Error: Data ဆွဲယူ၍ မရပါ။</td></tr>';
            }
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('uploadBtn');
            const fileInput = document.getElementById('pImageFile');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Saving...';

            try {
                const file = fileInput.files[0];
                let base64Image = "";
                
                if(file) {
                    base64Image = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                }

                const payload = {
                    name: document.getElementById('pName').value,
                    originalPrice: parseInt(document.getElementById('originalPrice').value),
                    discountPercent: parseInt(document.getElementById('discountPercent').value) || 0,
                    price: parseInt(document.getElementById('finalPrice').value),
                    category: document.getElementById('pCategory').value,
                    imageUrl: base64Image,
                    agentName: currentAgentName,
                    createdAt: new Date().toISOString()
                };

                const response = await fetch(`${API_BASE_URL}/products/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("အောင်မြင်ပါသည်! ကုန်ပစ္စည်းအသစ် ထည့်သွင်းပြီးပါပြီ။");
                    document.getElementById('productForm').reset();
                    document.getElementById('previewContainer').innerHTML = '<i class="fas fa-cloud-upload-alt"></i><span>Click to upload image</span>';
                    fetchMyProducts();
                } else {
                    alert("အမှားတစ်ခုရှိနေပါသည် (API Error)");
                }
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Save Product';
            }
        });

        async function deleteProduct(id) {
            if (confirm("ဤပစ္စည်းကို စာရင်းထဲမှ အပြီးဖျက်ရန် သေချာပါသလား?")) {
                try {
                    const response = await fetch(`${API_BASE_URL}/products/delete/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        fetchMyProducts();
                    } else {
                        alert("ဖျက်၍မရပါ။ Backend Error.");
                    }
                } catch (err) {
                    alert("Error: " + err.message);
                }
            }
        }

        function handleLogout() {
            if(confirm("Logout လုပ်မှာ သေချာပါသလား?")) {
                localStorage.removeItem('currentAgent');
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>
