<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products - Spider.io</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --sidebar: #1e293b; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); margin: 0; display: flex; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar); color: white; min-height: 100vh; padding: 2rem 1rem; position: fixed; z-index: 1000; box-sizing: border-box; }
        .sidebar h2 { padding-left: 1rem; margin-bottom: 2rem; color: #fff; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .nav-item { padding: 0.8rem 1rem; border-radius: 12px; color: #cbd5e1; text-decoration: none; margin-bottom: 0.5rem; display: flex; align-items: center; transition: 0.3s; cursor: pointer; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        .nav-item i { width: 20px; margin-right: 10px; }
        
        /* Main Content */
        .main-content { margin-left: 260px; padding: 2.5rem; width: calc(100% - 260px); box-sizing: border-box; }
        .grid-container { display: grid; grid-template-columns: 380px 1fr; gap: 2rem; align-items: start; }
        
        /* Form Card */
        .card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 700; color: #1e293b; font-size: 0.85rem; }
        input, select { width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 10px; outline: none; transition: 0.3s; font-family: inherit; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        .btn-create { background: var(--primary); color: white; padding: 1rem; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.3s; }
        .btn-create:hover { background: #4338ca; }
        .btn-create:disabled { background: #94a3b8; cursor: not-allowed; }
        
        /* Image Preview */
        .img-preview-box { width: 100%; height: 180px; border: 2px dashed #e2e8f0; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; overflow: hidden; background: #f8fafc; cursor: pointer; position: relative; }
        .img-preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .img-preview-box i { font-size: 2.5rem; color: #cbd5e1; }

        /* Table Section */
        .table-card { background: white; border-radius: 20px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; background: #f8fafc; padding: 15px; color: #64748b; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #f1f5f9; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; color: #334155; }
        .product-info { display: flex; align-items: center; gap: 12px; }
        .product-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: #f1f5f9; }
        .price-tag { font-weight: 700; color: #1e293b; }
        .discount-badge { background: #fef2f2; color: #ef4444; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }
        
        .btn-delete { color: #94a3b8; cursor: pointer; border: none; background: none; transition: 0.2s; font-size: 1.1rem; padding: 8px; border-radius: 8px; }
        .btn-delete:hover { color: #ef4444; background: #fef2f2; }

        @media (max-width: 1024px) {
            .sidebar { width: 85px; padding: 1.5rem 0.5rem; }
            .sidebar h2, .sidebar span { display: none; }
            .main-content { margin-left: 85px; width: calc(100% - 85px); padding: 1.5rem; }
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2><i class="fas fa-spider"></i> <span>Spider.io</span></h2>
        <a id="navDash" class="nav-item"><i class="fas fa-th-large"></i> <span>Dashboard</span></a>
        <a id="navInv" class="nav-item active"><i class="fas fa-box"></i> <span>My Products</span></a>
        <a id="navUsers" class="nav-item"><i class="fas fa-users"></i> <span>Customer List</span></a>
        <a id="navSettings" class="nav-item"><i class="fas fa-store"></i> <span>Shop Settings</span></a>
        <button class="nav-item" onclick="handleLogout()" style="margin-top: 5rem; color: #fb7185; background: none; border: none; width: 100%; text-align: left; cursor: pointer;">
            <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
        </button>
    </div>

    <div class="main-content">
        <h1 id="pageTitle" style="color: #0f172a; margin-bottom: 0.5rem;">Product Management</h1>
        <p id="pageSub" style="color: #64748b; margin-bottom: 2.5rem;">သင့်ဆိုင်ရှိ ကုန်ပစ္စည်းများကို စီမံခန့်ခွဲပါ</p>
        
        <div class="grid-container">
            <!-- Add Product Section -->
            <div class="card">
                <h3 style="margin-top: 0; margin-bottom: 1.5rem; font-size: 1.1rem; color: #0f172a;">
                    <i class="fas fa-plus-circle" style="color: var(--primary);"></i> Add New Product
                </h3>
                
                <form id="productForm">
                    <label>Product Image</label>
                    <div class="img-preview-box" id="previewContainer" onclick="document.getElementById('pImageFile').click()">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <input type="file" id="pImageFile" accept="image/*" onchange="previewImage(event)" style="display: none;" required>

                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" id="pName" placeholder="ဥပမာ - နွေရာသီဝတ် ဂါဝန်" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Category</label>
                        <select id="pCategory">
                            <option value="Boy">Boy</option>
                            <option value="Girl">Girl</option>
                            <option value="Kid">Kid</option>
                            <option value="Accessories">Accessories</option>
                        </select>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label>Price (Ks)</label>
                            <input type="number" id="originalPrice" placeholder="50000" required oninput="calculateDiscount()">
                        </div>
                        <div class="form-group">
                            <label>Discount (%)</label>
                            <input type="number" id="discountPercent" value="0" min="0" max="100" oninput="calculateDiscount()">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Final Price (ရောင်းဈေး)</label>
                        <input type="number" id="finalPrice" style="background:#f8fafc; font-weight:700; color: var(--primary);" readonly>
                    </div>
                    
                    <button type="submit" class="btn-create" id="uploadBtn">
                        <i class="fas fa-check-circle"></i> Save Product
                    </button>
                </form>
            </div>

            <!-- Inventory List Section -->
            <div class="table-card">
                <div style="padding: 1.5rem; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center;">
                    <h3 id="inventoryTitle" style="margin: 0; font-size: 1.1rem; color: #0f172a;">My Inventory</h3>
                    <span id="productCount" style="background: #eef2ff; color: var(--primary); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700;">0 Items</span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Product Details</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <tr><td colspan="4" style="text-align:center; padding: 40px; color: #94a3b8;">
                            <i class="fas fa-spinner fa-spin" style="font-size: 1.5rem; margin-bottom: 10px;"></i><br>Loading Products...
                        </td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://shopping-sable-sigma.vercel.app/api";
        let currentAgentName = "";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const agentFromUrl = urlParams.get('agent');
            const loggedInAgent = JSON.parse(localStorage.getItem('currentAgent'));
            
            currentAgentName = agentFromUrl || (loggedInAgent ? loggedInAgent.name : null);

            if (!currentAgentName) {
                window.location.href = "login.html";
                return;
            }

            // Update UI & Navigation
            const suffix = `?agent=${encodeURIComponent(currentAgentName)}`;
            document.getElementById('navDash').href = `agent-dashboard.html${suffix}`;
            document.getElementById('navInv').href = `inventory.html${suffix}`;
            document.getElementById('navUsers').href = `user_list.html${suffix}`;
            document.getElementById('navSettings').href = `shop-settings.html${suffix}`;
            
            document.getElementById('pageTitle').innerText = `${currentAgentName}'s Products`;

            fetchMyProducts();
        };

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('previewContainer').innerHTML = `<img src="${e.target.result}">`;
                };
                reader.readAsDataURL(file);
            }
        }

        function calculateDiscount() {
            const original = parseFloat(document.getElementById('originalPrice').value) || 0;
            const percent = parseFloat(document.getElementById('discountPercent').value) || 0;
            const discountAmount = (original * percent / 100);
            document.getElementById('finalPrice').value = Math.round(original - discountAmount);
        }

        async function fetchMyProducts() {
            try {
                // လက်ရှိ agent ရဲ့ ပစ္စည်းတွေကိုပဲ fetch လုပ်ဖို့ query parameter သုံးပါတယ်
                const response = await fetch(`${API_BASE_URL}/products?agent=${encodeURIComponent(currentAgentName)}`);
                const products = await response.json();
                
                const tbody = document.getElementById('productTableBody');
                document.getElementById('productCount').innerText = `${products.length} Items`;

                if (!products || products.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:40px; color:#94a3b8;">ပစ္စည်းစာရင်း မရှိသေးပါ။</td></tr>';
                    return;
                }

                tbody.innerHTML = products.map(p => {
                    const hasDiscount = p.discountPercent > 0;
                    return `
                        <tr>
                            <td>
                                <div class="product-info">
                                    <img src="${p.imageUrl || 'https://via.placeholder.com/50'}" class="product-img">
                                    <div>
                                        <div style="font-weight:700;">${p.name}</div>
                                        <div style="font-size:0.75rem; color:#94a3b8;">ID: ${p._id.substring(18)}</div>
                                    </div>
                                </div>
                            </td>
                            <td><span style="background:#f1f5f9; padding:4px 10px; border-radius:6px; font-size:0.8rem;">${p.category}</span></td>
                            <td>
                                <div class="price-tag">${(p.price || 0).toLocaleString()} Ks</div>
                                ${hasDiscount ? `<span class="discount-badge">-${p.discountPercent}%</span>` : ''}
                            </td>
                            <td>
                                <button class="btn-delete" onclick="deleteProduct('${p._id}')" title="Delete Product">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('productTableBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color:#ef4444; padding:20px;">Data ဆွဲယူ၍ မရပါ။</td></tr>';
            }
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('uploadBtn');
            const fileInput = document.getElementById('pImageFile');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            try {
                const file = fileInput.files[0];
                let base64Image = "";
                
                if(file) {
                    base64Image = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                }

                const payload = {
                    name: document.getElementById('pName').value,
                    originalPrice: parseInt(document.getElementById('originalPrice').value),
                    discountPercent: parseInt(document.getElementById('discountPercent').value) || 0,
                    price: parseInt(document.getElementById('finalPrice').value),
                    category: document.getElementById('pCategory').value,
                    imageUrl: base64Image,
                    agentName: currentAgentName,
                    createdAt: new Date().toISOString()
                };

                const response = await fetch(`${API_BASE_URL}/products/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("ကုန်ပစ္စည်း အသစ်တင်ခြင်း အောင်မြင်ပါသည်။");
                    document.getElementById('productForm').reset();
                    document.getElementById('previewContainer').innerHTML = '<i class="fas fa-cloud-upload-alt"></i>';
                    fetchMyProducts();
                } else {
                    alert("ပစ္စည်းတင်မရဖြစ်နေပါသည်။ API Error.");
                }
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Save Product';
            }
        });

        async function deleteProduct(id) {
            if (confirm("ဒီပစ္စည်းကို စာရင်းထဲမှ အပြီးဖျက်မှာ သေချာပါသလား?")) {
                try {
                    const response = await fetch(`${API_BASE_URL}/products/delete/${id}`, { 
                        method: 'DELETE' 
                    });
                    if (response.ok) {
                        fetchMyProducts();
                    } else {
                        alert("ဖျက်လို့ မရပါ။ Backend Error.");
                    }
                } catch (err) {
                    alert("Error: " + err.message);
                }
            }
        }

        function handleLogout() {
            localStorage.removeItem('currentAgent');
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
