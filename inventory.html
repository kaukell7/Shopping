<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products - Spider.io</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --sidebar: #1e293b; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); margin: 0; display: flex; }
        .sidebar { width: 260px; background: var(--sidebar); color: white; min-height: 100vh; padding: 2rem 1rem; position: fixed; z-index: 1000; box-sizing: border-box; }
        .sidebar h2 { padding-left: 1rem; margin-bottom: 2rem; color: #fff; font-weight: 800; }
        .nav-item { padding: 0.8rem 1rem; border-radius: 8px; color: #cbd5e1; text-decoration: none; margin-bottom: 0.5rem; display: flex; align-items: center; transition: 0.3s; cursor: pointer; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        .nav-item i { width: 20px; margin-right: 10px; }
        .main-content { margin-left: 260px; padding: 2.5rem; width: calc(100% - 260px); box-sizing: border-box; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: start; }
        .card { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #1e293b; font-size: 0.9rem; }
        input, select { width: 100%; padding: 0.8rem; border: 1px solid #e2e8f0; border-radius: 8px; outline: none; transition: 0.3s; box-sizing: border-box; }
        .btn-create { background: var(--primary); color: white; padding: 0.9rem; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-create:disabled { background: #94a3b8; cursor: not-allowed; }
        .img-preview-box { width: 100%; height: 150px; border: 2px dashed #e2e8f0; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; overflow: hidden; background: #f8fafc; }
        .img-preview-box img { max-height: 100%; max-width: 100%; object-fit: contain; }
        .table-card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; background: #f8fafc; padding: 12px; color: #64748b; font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        .product-img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; border: 1px solid #eee; }
        .btn-delete { color: #ef4444; cursor: pointer; border: none; background: none; transition: 0.2s; font-size: 1rem; }
        @media (max-width: 1024px) { .sidebar { width: 80px; } .sidebar h2, .sidebar span { display: none; } .main-content { margin-left: 80px; width: calc(100% - 80px); } .grid-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Spider.io</h2>
        <a id="navDash" class="nav-item"><i class="fas fa-home"></i> <span>Dashboard</span></a>
        <a id="navInv" class="nav-item active"><i class="fas fa-box-open"></i> <span>My Products</span></a>
        <a id="navUsers" class="nav-item"><i class="fas fa-users"></i> <span>Customer List</span></a>
        <a id="navSettings" class="nav-item"><i class="fas fa-store"></i> <span>Shop Settings</span></a>
        <button class="nav-item" onclick="handleLogout()" style="margin-top: 20px; color: #f87171; background: none; border: none; width: 100%; text-align: left; cursor: pointer;">
            <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
        </button>
    </div>

    <div class="main-content">
        <h1 id="pageTitle" style="margin-bottom: 2rem;">Product Management</h1>
        
        <div class="grid-container">
            <div class="card" id="addProductSection">
                <h3 style="margin-top: 0;"><i class="fas fa-plus-circle"></i> Add New Product</h3>
                <div class="img-preview-box" id="previewContainer">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 2rem; color: #cbd5e1;"></i>
                </div>

                <form id="productForm">
                    <div class="form-group">
                        <label>Product Image</label>
                        <input type="file" id="pImageFile" accept="image/*" onchange="previewImage(event)" required>
                    </div>
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" id="pName" placeholder="T-Shirt" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="pCategory">
                            <option value="boy">Boy</option>
                            <option value="girl">Girl</option>
                            <option value="kid">Kid</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Price (Ks)</label>
                        <input type="number" id="originalPrice" placeholder="50000" required oninput="calculateDiscount()">
                    </div>
                    <div class="form-group">
                        <label>Discount (%)</label>
                        <input type="number" id="discountPercent" value="0" oninput="calculateDiscount()">
                    </div>
                    <div class="form-group">
                        <label>Final Price</label>
                        <input type="number" id="finalPrice" style="background:#f1f5f9; font-weight:700;" readonly>
                    </div>
                    <button type="submit" class="btn-create" id="uploadBtn">Save Product</button>
                </form>
            </div>

            <div class="table-card">
                <h3 id="inventoryTitle" style="padding: 1.5rem; margin: 0; border-bottom: 1px solid #f1f5f9;">My Inventory</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <tr><td colspan="4" style="text-align:center; padding: 20px;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://shopping-sable-sigma.vercel.app/api";
        let currentAgentName = "";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const agentFromUrl = urlParams.get('agent');
            const loggedInAgent = JSON.parse(localStorage.getItem('currentAgent'));
            
            currentAgentName = agentFromUrl || (loggedInAgent ? loggedInAgent.name : null);

            if (!currentAgentName) {
                window.location.href = "login.html";
                return;
            }

            const suffix = `?agent=${encodeURIComponent(currentAgentName)}`;
            document.getElementById('navDash').href = `agent-dashboard.html${suffix}`;
            document.getElementById('navInv').href = `inventory.html${suffix}`;
            document.getElementById('navUsers').href = `user_list.html${suffix}`;
            document.getElementById('navSettings').href = `shop-settings.html${suffix}`;
            
            document.getElementById('pageTitle').innerText = `${currentAgentName}'s Products`;
            document.getElementById('inventoryTitle').innerText = `${currentAgentName}'s Inventory`;

            fetchMyProducts();
        };

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('previewContainer').innerHTML = `<img src="${e.target.result}">`;
                };
                reader.readAsDataURL(file);
            }
        }

        function calculateDiscount() {
            const original = parseFloat(document.getElementById('originalPrice').value) || 0;
            const percent = parseFloat(document.getElementById('discountPercent').value) || 0;
            document.getElementById('finalPrice').value = Math.round(original - (original * percent / 100));
        }

        async function fetchMyProducts() {
            try {
                const response = await fetch(`${API_BASE_URL}/products?agent=${encodeURIComponent(currentAgentName)}`);
                const products = await response.json();
                
                const tbody = document.getElementById('productTableBody');
                if (!products || products.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px;">ပစ္စည်းမရှိသေးပါ။</td></tr>';
                    return;
                }

                tbody.innerHTML = products.map(p => `
                    <tr>
                        <td><img src="${p.imageUrl || 'https://via.placeholder.com/50'}" class="product-img"></td>
                        <td><strong>${p.name}</strong><br><small style="color:#94a3b8">${p.category}</small></td>
                        <td>${(p.price || 0).toLocaleString()} Ks</td>
                        <td><button class="btn-delete" onclick="deleteProduct('${p._id}')"><i class="fas fa-trash"></i></button></td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('productTableBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">ဒေတာဆွဲယူ၍မရပါ။</td></tr>';
            }
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('uploadBtn');
            const fileInput = document.getElementById('pImageFile');
            
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const file = fileInput.files[0];
                let base64Image = "";
                
                if(file) {
                    base64Image = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                }

                const payload = {
                    name: document.getElementById('pName').value,
                    originalPrice: parseInt(document.getElementById('originalPrice').value),
                    discountPercent: parseInt(document.getElementById('discountPercent').value) || 0,
                    price: parseInt(document.getElementById('finalPrice').value),
                    category: document.getElementById('pCategory').value,
                    imageUrl: base64Image,
                    agentName: currentAgentName
                };

                const response = await fetch(`${API_BASE_URL}/products/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("ပစ္စည်းအသစ် တင်ပြီးပါပြီ!");
                    document.getElementById('productForm').reset();
                    document.getElementById('previewContainer').innerHTML = '<i class="fas fa-cloud-upload-alt" style="font-size: 2rem; color: #cbd5e1;"></i>';
                    fetchMyProducts();
                } else {
                    alert("တင်မရဖြစ်နေပါသည်။ ပြန်ကြိုးစားကြည့်ပါ။");
                }
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Save Product";
            }
        });

        async function deleteProduct(id) {
            if (confirm("ဒီပစ္စည်းကို ဖျက်မှာ သေချာပါသလား?")) {
                try {
                    const response = await fetch(`${API_BASE_URL}/products/delete/${id}`, { method: 'DELETE' });
                    if (response.ok) fetchMyProducts();
                    else alert("ဖျက်လို့မရပါ");
                } catch (err) {
                    alert("Error: " + err.message);
                }
            }
        }

        function handleLogout() {
            localStorage.removeItem('currentAgent');
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
